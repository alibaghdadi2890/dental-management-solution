# Local development infrastructure. `pnpm dev` starts it, migrates and runs api + web.
# Host ports avoid clashing with locally installed Postgres/Redis; override with DCM_*_PORT in the shell.
name: dcm

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dcm
      POSTGRES_USER: dcm_owner
      POSTGRES_PASSWORD: dcm_owner
    ports:
      - '${DCM_POSTGRES_PORT:-55432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dcm_owner -d dcm']
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - '${DCM_REDIS_PORT:-56379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

  # S3-compatible object storage (ADR-0006: MinIO no longer publishes images).
  s3:
    image: chrislusf/seaweedfs:4.47
    entrypoint: ['/bin/sh', '/start.sh']
    environment:
      S3_BUCKET: dcm-local
    ports:
      - '${DCM_S3_PORT:-58333}:8333'
    volumes:
      - s3-data:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
      - ./docker/seaweedfs/start.sh:/start.sh:ro
    healthcheck:
      test: ['CMD', 'test', '-f', '/tmp/ready']
      interval: 2s
      timeout: 3s
      retries: 60

volumes:
  postgres-data:
  redis-data:
  s3-data:
