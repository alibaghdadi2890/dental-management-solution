# The web container's nginx (apps/web/Dockerfile). One origin for everything (CLAUDE.md §6: cookie
# sessions need the SPA and the API on the same origin): the SPA from disk, /api and /health to the
# API container, and the object store under the bucket's path, so the presigned upload and download
# URLs the API hands the browser point at this same address (infra/compose/docker-compose.yml).
# Behind Cloudflare (https://www.cloudflare.com/ips/, the same list as the studio's lightsail-erp
# module): its edge connects from these ranges, so only from them is CF-Connecting-IP taken as the
# real client address (logs, sessions). From anywhere else the header is ignored.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# The scheme the browser used: Cloudflare says it in X-Forwarded-Proto; a request straight to the box
# (a health check on localhost) has none, and its own scheme is used.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80 default_server;
    server_name _;

    # Plain HTTP through Cloudflare: send the browser to HTTPS (the zone does not redirect by itself).
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    # A file is at most 25 MB (MAX_FILE_BYTES in @dcm/contracts); the rest is headroom for the
    # browser's display copy and thumbnail in the same request burst.
    client_max_body_size 32m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The API. These blocks must precede the SPA fallback, or try_files would answer
    # /api/... with index.html.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    location /health/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # The object store (SeaweedFS, S3 API), bucket "dcm", path style: the API signs the browser's
    # URLs for this host (S3_PUBLIC_ENDPOINT = http://<this address>) and the signature covers the
    # Host header, so it is passed through unchanged. Uploads stream straight through.
    location /dcm/ {
        proxy_pass http://s3:8333;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }

    root /usr/share/nginx/html;
    index index.html;

    # Vite fingerprints everything under /assets/, so it is safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached: it is what points at the current bundle hash.
    location / {
        try_files $uri /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
